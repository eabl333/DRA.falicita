<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F58220">
<title>Site em manutenção | Felicitá Odontologia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#FFC72C;--accent-soft:#FFF4D6;
  --brand:#F58220;--brand-dark:#D96A0D;--brand-soft:#FEE9D3;
  --sand:#FFFBF5;--gray-dark:#4A4A4C;--gray:#6D6E71;
  --line:rgba(109,110,113,.16);
  --font-display:"Fraunces",Georgia,serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;font-family:var(--font-body);line-height:1.65;color:#3A3A3A;
  background:
    radial-gradient(900px 520px at 88% -8%,rgba(255,199,44,.26),transparent 62%),
    radial-gradient(700px 420px at -8% 100%,rgba(245,130,32,.18),transparent 60%),
    linear-gradient(180deg,#fff,var(--sand));
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.card{
  width:100%;max-width:600px;background:#fff;border:1px solid var(--line);
  border-radius:28px;box-shadow:0 26px 64px rgba(58,58,58,.12);
  padding:48px 44px 36px;text-align:center;
}
.logo{display:inline-flex;align-items:center;gap:.7rem;margin-bottom:30px}
.logo__mark{
  width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--brand));
  box-shadow:0 4px 12px rgba(245,130,32,.28);
}
.logo__mark svg{width:26px;height:26px;stroke:#fff}
.logo__text{display:flex;flex-direction:column;text-align:left;line-height:1}
.logo__name{font-family:var(--font-display);font-size:1.5rem;font-weight:600;color:var(--gray-dark)}
.logo__sub{font-size:.66rem;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--gray);margin-top:4px}

.gear{
  width:88px;height:88px;margin:0 auto 22px;border-radius:50%;
  background:var(--accent-soft);display:grid;place-items:center;
}
.gear svg{width:46px;height:46px;stroke:var(--brand);fill:none;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.status{
  display:inline-flex;align-items:center;gap:.5rem;margin-bottom:16px;
  padding:6px 14px;border-radius:999px;background:var(--brand-soft);
  color:var(--brand-dark);font-size:.8rem;font-weight:600;
}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}

h1{
  font-family:var(--font-display);font-weight:500;color:var(--gray-dark);
  font-size:clamp(1.8rem,5.2vw,2.5rem);line-height:1.15;letter-spacing:-.015em;
  margin:0 0 .9rem;text-wrap:balance;
}
.lead{margin:0 auto 1.8rem;max-width:440px;color:var(--gray);text-wrap:pretty}

.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:.75rem;margin-bottom:6px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  min-height:50px;padding:14px 26px;border-radius:999px;border:1px solid transparent;
  font-weight:600;font-size:.94rem;text-decoration:none;
  transition:transform .25s ease,background-color .25s ease,border-color .25s ease;
}
.btn svg{width:18px;height:18px;flex:none}
.btn--primary{background:var(--brand);color:#fff;box-shadow:0 10px 30px rgba(245,130,32,.28)}
.btn--primary:hover{background:var(--brand-dark);transform:translateY(-2px)}
.btn--outline{color:var(--brand-dark);border-color:var(--line);background:#fff}
.btn--outline:hover{border-color:var(--brand);transform:translateY(-2px)}
.btn:focus-visible{outline:3px solid var(--brand);outline-offset:3px}

.info{
  margin-top:30px;padding-top:24px;border-top:1px solid var(--line);
  display:grid;gap:.5rem;font-size:.86rem;color:var(--gray);
}
.info strong{color:var(--gray-dark);font-weight:600}
.info a{color:var(--brand-dark);text-decoration:none;border-bottom:1px solid rgba(245,130,32,.3)}
.info a:hover{border-color:var(--brand)}

@media (max-width:480px){
  .card{padding:36px 22px 28px;border-radius:22px}
  .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){
  .gear svg{animation:none}
  .btn{transition:none}
}
</style>
</head>
<body>
<main class="card">

  <div class="logo">
    <span class="logo__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4C10.5 4 9.8 4.9 8.6 4.9 7.4 4.9 6.5 4 5.2 4 3 4 2.5 6.5 2.5 8.5c0 3 1.1 5 1.9 7.5.6 2 .8 5 2.4 5 1.6 0 1.6-4 2.7-5.7.5-.8 1.3-1.1 2.5-1.1s2 .3 2.5 1.1c1.1 1.7 1.1 5.7 2.7 5.7 1.6 0 1.8-3 2.4-5 .8-2.5 1.9-4.5 1.9-7.5 0-2-.5-4.5-2.7-4.5-1.3 0-2.2.9-3.4.9C14.2 4.9 13.5 4 12 4Z"/>
      </svg>
    </span>
    <span class="logo__text">
      <span class="logo__name">Felicitá</span>
      <span class="logo__sub">Odontologia</span>
    </span>
  </div>

  <div class="gear" aria-hidden="true">
    <svg viewBox="0 0 24 24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
    </svg>
  </div>

  <p class="status">Site em manutenção</p>

  <h1>Estamos melhorando o nosso site.</h1>

  <p class="lead">Voltamos em breve com novidades. Enquanto isso, nossa equipe continua atendendo: fale com a clínica para tirar dúvidas e solicitar uma consulta.</p>



</main>
</body>
</html>
